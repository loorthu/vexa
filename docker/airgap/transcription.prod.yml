# Air-gap override for the GPU transcription stack.
# Layered on top of services/transcription-service/docker-compose.yml so the
# workers run from the pre-loaded image instead of building on the prod host.
#
#   docker compose \
#     -f services/transcription-service/docker-compose.yml \
#     -f docker/airgap/transcription.prod.yml \
#     up -d --no-build
#
# dns_search "." + ndots:0: on hosts with a corporate DNS search domain, nginx
# in the LB fails to resolve the single-label upstream names at startup
# ("host not found in upstream transcription-worker-1") and crash-loops. Same
# fix as the core stack's dns.prod.yml — force single-label names to resolve
# via Docker's embedded DNS instead of being suffixed with the corporate domain.
services:
  # nginx load balancer (container: transcription-lb). Resolves the worker
  # upstreams at startup — this is the one that was crash-looping.
  transcription-api:
    dns_search: ["."]
    dns_opt: ["ndots:0"]

  transcription-worker-1:
    image: vexaai/vexa-transcription:${IMAGE_TAG:-latest}
    pull_policy: never
    dns_search: ["."]
    dns_opt: ["ndots:0"]
    # Force HuggingFace to use the shipped model cache only — no network
    # probe for a newer revision (which would time out on an air-gapped host).
    environment:
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
  transcription-worker-2:
    image: vexaai/vexa-transcription:${IMAGE_TAG:-latest}
    pull_policy: never
    dns_search: ["."]
    dns_opt: ["ndots:0"]
    environment:
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
