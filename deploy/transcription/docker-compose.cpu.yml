# =============================================================================
# Transcription service — CPU-only variant (no GPU). For dev/testing.
# =============================================================================
#   docker compose -f docker-compose.cpu.yml up -d
# Slower + lower accuracy than GPU; use a smaller MODEL_SIZE (e.g. base/small/medium).
services:
  transcription-api:
    image: nginx:alpine
    ports:
      - "${TRANSCRIPTION_LB_PORT:-8083}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    # nginx:alpine is musl-based, and musl gives up on a single-label name once the host's
    # search domain misses: this host's resolv.conf carries `search <domain>` + `ndots:2`, so
    # `transcription-worker-1` is looked up as `transcription-worker-1.<domain>` (NXDOMAIN) and
    # never retried bare. nginx resolves upstreams at config-load time, so it dies outright with
    # "host not found in upstream" and crash-loops -- while the worker beside it is healthy.
    # glibc containers on the same network resolve the very same name fine, which is what makes
    # this look like anything but DNS. ndots:0 tries the name as absolute first, so Docker's
    # embedded resolver answers before the search domain is ever appended.
    dns_opt: ["ndots:0"]
    depends_on:
      - transcription-worker-1
    restart: unless-stopped
    networks: [transcription-net]

  transcription-worker-1:
    build:
      context: ../..
      dockerfile: core/meetings/services/transcription/Dockerfile.cpu
    image: vexaai/v012-transcription-cpu:${IMAGE_TAG:-dev}
    environment:
      - WORKER_ID=1
      # Default `small`, not `medium`: on a CPU worker `medium` cannot keep up with real-time meeting
      # audio and sheds load with 503 "Service busy" (a fresh self-host on a modest VM gets NO
      # transcript). `small` keeps pace on ~4-6 vCPU (witnessed). Raise to medium/large only with GPU.
      - MODEL_SIZE=${MODEL_SIZE:-small}
      - DEVICE=cpu
      - COMPUTE_TYPE=int8
      - CPU_THREADS=${CPU_THREADS:-0}
      - API_TOKEN=${API_TOKEN:-}
    volumes:
      - transcription-models:/app/models
    dns_opt: ["ndots:0"]   # see transcription-api above
    restart: unless-stopped
    networks: [transcription-net]

networks:
  transcription-net:
    driver: bridge

volumes:
  transcription-models:
